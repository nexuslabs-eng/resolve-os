<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    Favicon-optimized Resolution Node.
    Geometry is deliberately heavier than the normal brand mark
    so it survives 16x16 browser rendering.
  -->

  <g stroke="#818CF8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Upper input -->
    <path d="M2.8 7.5H6
         C9.2 7.5 10.4 9.5 12.2 12.3
         L14.3 15.8" opacity="0.9"></path>

    <!-- Center input -->
    <path d="M2.8 15.8H14.3" opacity="1"></path>

    <!-- Lower input -->
    <path d="M2.8 24.1H6
         C9.2 24.1 10.4 22.1 12.2 19.3
         L14.3 15.8" opacity="0.9"></path>

    <!-- Resolved output -->
    <path d="M20.3 15.8H29.2" opacity="1"></path>
  </g>

  <!-- Input nodes -->
  <g fill="#818CF8">
    <circle cx="2.8" cy="7.5" r="2.3"></circle>
    <circle cx="2.8" cy="15.8" r="2.3"></circle>
    <circle cx="2.8" cy="24.1" r="2.3"></circle>
  </g>

  <!-- Resolution diamond -->
  <rect x="12.2" y="10" width="11.6" height="11.6" rx="2" transform="rotate(45 18 15.8)" fill="#090D14" stroke="#A5B4FC" stroke-width="2.4"></rect>

  <!-- Resolution core -->
  <rect x="15.1" y="12.9" width="5.8" height="5.8" rx="1" transform="rotate(45 18 15.8)" fill="#818CF8"></rect>
</svg>